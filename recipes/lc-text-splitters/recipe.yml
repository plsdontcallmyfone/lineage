# langchain-ai/langchain, package libs/text-splitters (langchain-text-splitters 1.1.3): the
# chunkers RAG pipelines use to cut documents before embedding (recursive character, code-aware,
# Markdown header). MIT licence (LICENSE; package metadata `license = MIT`). Contribution policy:
# no CONTRIBUTING file in the repo; AGENTS.md welcomes agent-assisted PRs and asks for a brief
# disclaimer noting AI-agent involvement (checked 2026-10-07). No ban. Upstream PRs only after
# opt-in (SPEC 16), and then with that disclaimer.
#
# Why: the splitters are pure Python string processing (regex splits, repeated len() calls,
# list rebuilding while merging splits with overlap), run over every document in a RAG index,
# so instruction counts have real headroom.
#
# Monorepo: only libs/text-splitters is patchable and tested. Its one dependency, langchain-core,
# is installed into the venv from the same snapshot (libs/core, --no-deps) during prepare, with
# its own dependencies pinned to the versions in libs/text-splitters/uv.lock. The package under
# test is imported from the tree (PYTHONPATH), never installed. bs4 and lxml are installed so
# the HTML splitter tests run instead of being skipped; spacy, nltk, transformers,
# sentence-transformers and tiktoken are not (their tests are skipped by upstream's own
# `requires` marker and never counted).
#
# Mirror: GitHub reports ~610 MB for the full history; the reference runner seeded
# ~/.lineage/mirrors with a single-commit shallow fetch (18 MB).
#
# Determinism (verified by scripts/calibrate-recipe.ts, cv in calibration.json): as in
# base58-py and minbpe: PYTHONHASHSEED=0, cyclic GC disabled in the harness, inputs only from
# $LINEAGE_SEED and repository files, stdlib and venv byte-compiled in prepare into
# /deps/pycache and used through PYTHONPYCACHEPREFIX.
#
# Measured region: importing langchain_text_splitters (langchain_core, pydantic, langsmith)
# costs ~1.24G instructions, more than the splitting work itself, so whole-process counts
# would dilute every effect several-fold. The harness calls its work function through ctypes
# (libffi ffi_call) and the metric is callgrind's instruction count with
# --toggle-collect=ffi_call: only that call is counted. Same parser (cachegrind-ir matches
# callgrind's "I refs" summary).
name: lc-text-splitters
class: python
requires: { arch: arm64 }
repo: https://github.com/langchain-ai/langchain
commit: "4db8c0e8359dc9789669af140e9c2728718566f8"
image: "lineage/python:m1@sha256:4214b1a6fb3757b7d706ce9547e728b18c53df40f0bdf8ebcdef5b81335186d0"
workdir: /work/src
prepare:
  - python -m venv /deps/venv
  - "/deps/venv/bin/pip install --no-cache-dir --only-binary=:all: annotated-types==0.7.0 anyio==4.15.1 certifi==2025.8.3 charset-normalizer==3.4.3 h11==0.16.0 httpcore==1.0.9 httpx==0.28.1 idna==3.15 jsonpatch==1.33 jsonpointer==3.0.0 langchain-protocol==0.0.18 langsmith==0.9.4 orjson==3.11.6 packaging==25.0 pydantic==2.13.4 pydantic-core==2.46.4 pyyaml==6.0.3 requests==2.33.0 requests-toolbelt==1.0.0 sniffio==1.3.1 tenacity==9.1.4 typing-extensions==4.16.0 typing-inspection==0.4.2 urllib3==2.8.0 uuid-utils==0.16.2 xxhash==3.6.0 zstandard==0.25.0 pytest==9.1.1 pytest-asyncio==1.4.0 pytest-mock==3.16.0 pytest-socket==0.8.1 freezegun==1.5.5 python-dateutil==2.9.0.post0 six==1.17.0 iniconfig==2.1.0 pluggy==1.6.0 pygments==2.20.0 beautifulsoup4==4.15.0 soupsieve==2.9 lxml==6.0.2"
  - /deps/venv/bin/pip install --no-cache-dir --no-deps ./libs/core
  - /deps/venv/bin/pip check
  - PYTHONPYCACHEPREFIX=/deps/pycache python -m compileall -q -x "/(test|tests|idlelib|lib2to3|tkinter|turtledemo)/" /usr/local/lib/python3.12 /deps/venv/lib/python3.12/site-packages
prepare_outputs: []
build:
  # Pure Python: "build" is an import check, which fails on syntax errors and import-time crashes.
  commands:
    - PYTHONPATH=libs/text-splitters python -c "import langchain_text_splitters as m, langchain_core, sys; print(m.__file__, langchain_core.__version__, sys.version.split()[0])"
  artifacts: []
  reproducible: false
test:
  # Upstream's Makefile runs `pytest --disable-socket --allow-unix-socket tests/unit_tests`.
  command: cd libs/text-splitters && PYTHONPATH=. PYTHONPYCACHEPREFIX=/deps/pycache python -m pytest -p no:cacheprovider -q --disable-socket --allow-unix-socket --junitxml=/out/junit.xml tests/unit_tests
  parser: junit
  exclude: []
  timeout_s: 900
equivalence:
  command: PYTHONPYCACHEPREFIX=/deps/pycache python lineage_equiv.py "$LINEAGE_SEED"
  output: stdout-digest
metrics:
  - name: recursive_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=callgrind --toggle-collect=ffi_call --dump-instr=no --callgrind-out-file=/dev/null python lineage_bench.py recursive "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: code_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=callgrind --toggle-collect=ffi_call --dump-instr=no --callgrind-out-file=/dev/null python lineage_bench.py code "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: markdown_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=callgrind --toggle-collect=ffi_call --dump-instr=no --callgrind-out-file=/dev/null python lineage_bench.py markdown "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
patch:
  allowed_paths: ["libs/text-splitters/langchain_text_splitters/**"]
  protected_paths:
    - "libs/text-splitters/tests/**"
    - "libs/text-splitters/pyproject.toml"
    - "libs/text-splitters/uv.lock"
    - "libs/text-splitters/langchain_text_splitters/py.typed"
    - "libs/core/**"
    - ".github/**"
    - "**/*.yml"
    - "**/*.yaml"
    - "lineage_*"
  max_files: 5
  max_lines: 200
limits: { cpus: 2, memory_mb: 3072, pids: 256, wall_s: 1800, disk_mb: 4096 }
