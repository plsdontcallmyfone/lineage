# Fixture recipe for the cuda target class (SPEC 6.1): fixtures/cuda-reduce, a two-kernel library
# with planted inefficiencies (interleaved-modulo shared-memory reduction; a global load repeated
# inside a loop because the compiler cannot prove it does not alias the store).
# The commit is deterministic (fixed author and dates), see packages/sandbox/src/repo.ts.
#
# Pinned and calibrated in the GPU session of 2026-10-08 (docs/GPU-SESSION.md): image built from
# images/cuda on an RTX 4000 Ada (sm 8.9), calibration.json from 5 runs, warp-instruction metrics cv 0.
# requires.gpu.sm and the -arch flags below must agree; scripts/gpu/session.sh re-pins both for
# another GPU (SM=86 for an A10 or A6000, SM=89 for an L4 or RTX 4000 Ada).
name: fixture-cuda
class: cuda
requires: { arch: amd64, gpu: { vendor: nvidia, sm: "8.9" } }
repo: "fixture:cuda-reduce"
commit: "3f72f8b01f68c26b67943ab93e5e17c86b1e112d"
image: "lineage/cuda:m1@sha256:4f440a3ca551ebdeb52aecf6ce34283af257d8f5d31329493c9b8e3d4a9dd715"
workdir: /work/src
prepare: []
build:
  commands:
    - make SM=89 all
    - /usr/local/cuda/bin/nvcc -O3 -std=c++17 -arch=sm_89 -o build/lineage_harness lineage/harness.cu src/kernels.cu
  artifacts: []
  reproducible: false
test:
  command: ./build/test_kernels
  parser: tap
  exclude: []
  timeout_s: 300
equivalence:
  command: ./build/lineage_harness equiv "$LINEAGE_SEED"
  output: stdout-digest
metrics:
  - name: reduce_warp_inst
    kind: perf
    direction: lower
    deterministic: true
    command: ncu --csv --print-units base --clock-control none --metrics smsp__inst_executed.sum -k regex:reduce_sum_kernel ./build/lineage_harness bench reduce "$LINEAGE_SEED"
    parser: ncu-inst
    holdout: true
    min_effect: 0.01
  - name: scale_warp_inst
    kind: perf
    direction: lower
    deterministic: true
    command: ncu --csv --print-units base --clock-control none --metrics smsp__inst_executed.sum -k regex:row_scale_kernel ./build/lineage_harness bench scale "$LINEAGE_SEED"
    parser: ncu-inst
    holdout: true
    min_effect: 0.01
  - name: reduce_us
    kind: perf
    direction: lower
    deterministic: false
    command: ./build/lineage_harness time reduce "$LINEAGE_SEED"
    parser: number
    rounds: 15
    min_effect: 0.05
patch:
  allowed_paths: ["src/**"]
  protected_paths: ["tests/**", "Makefile", "lineage/**"]
  max_files: 5
  max_lines: 200
limits: { cpus: 2, memory_mb: 4096, pids: 256, wall_s: 900, disk_mb: 4096 }
