# karpathy/minbpe, second recipe: the same repository and commit as recipes/minbpe (frozen), with a
# heavier workload and five targets (docs/plans/AGENT-EFFICIENCY.md section 6).
# MIT licence (LICENSE). No contribution policy against AI-generated changes (no CONTRIBUTING
# file; README has no contribution rules; checked 2026-10-07).
#
# Why a second recipe: at the first unit's tip, starting the interpreter and the imports had become
# 60% of train_ir and 52% of encode_ir, so the 1% minimum effect was 2.5% of what a change to the
# library can touch, and there were two targets for up to three agents. Here the library is nearly
# all of every count (the share that is not the library is measured by
# `python lineage_bench.py <mode> <seed> --inputs-only`, scripts/efficiency/fixed-share.ts), and the
# targets are BasicTokenizer.train, RegexTokenizer.train (GPT-4 and GPT-2 patterns), encode on long
# texts with and without special tokens, decode of long id lists, and save and load.
#
# Offline tests, prepare, the byte-compiled stdlib and the determinism notes are those of
# recipes/minbpe: cachegrind counts guest instructions only; PYTHONHASHSEED=0 is set by the sandbox;
# the harness turns the cyclic GC off; inputs come only from $LINEAGE_SEED and repo files; residual
# drift (process environment, first run in a fresh container) is far below det_tolerance (0.1%).
# The harness does not import tiktoken (a stub module stands in; GPT4Tokenizer is covered by the
# tests, which use the real one).
name: minbpe-heavy
class: python
requires: { arch: arm64 }
repo: https://github.com/karpathy/minbpe
commit: "1acefe89412b20245db5a22d2a02001e547dc602"
image: "lineage/python:m1@sha256:4214b1a6fb3757b7d706ce9547e728b18c53df40f0bdf8ebcdef5b81335186d0"
workdir: /work/src
prepare:
  - python -m venv /deps/venv
  - "/deps/venv/bin/pip install --no-cache-dir --only-binary=:all: pytest==8.3.5 regex==2024.11.6 tiktoken==0.9.0"
  - TIKTOKEN_CACHE_DIR=/deps/tiktoken /deps/venv/bin/python -c "import tiktoken; print(tiktoken.get_encoding('cl100k_base').n_vocab)"
  - PYTHONPYCACHEPREFIX=/deps/pycache python -m compileall -q -x "/(test|tests|idlelib|lib2to3|tkinter|turtledemo)/" /usr/local/lib/python3.12 /deps/venv/lib/python3.12/site-packages
prepare_outputs: []
build:
  # Pure Python: "build" is an import check, which fails on syntax errors and import-time crashes.
  commands:
    - python -c "import minbpe, sys; print(sys.version.split()[0])"
  artifacts: []
  reproducible: false
test:
  command: PYTHONPYCACHEPREFIX=/deps/pycache TIKTOKEN_CACHE_DIR=/deps/tiktoken python -m pytest -p no:cacheprovider -q --junitxml=/out/junit.xml tests
  parser: junit
  exclude: []
  timeout_s: 600
equivalence:
  command: PYTHONPYCACHEPREFIX=/deps/pycache python lineage_equiv.py "$LINEAGE_SEED"
  output: stdout-digest
metrics:
  - name: train_basic_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py train_basic "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: train_regex_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py train_regex "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: encode_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py encode "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: decode_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py decode "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: save_load_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py save_load "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
patch:
  allowed_paths: ["minbpe/**"]
  protected_paths:
    - "tests/**"
    - "requirements.txt"
    - "train.py"
    - ".github/**"
    - "**/*.yml"
    - "**/*.yaml"
    - "lineage_*"
  max_files: 5
  max_lines: 200
limits: { cpus: 2, memory_mb: 2048, pids: 256, wall_s: 1800, disk_mb: 4096 }
