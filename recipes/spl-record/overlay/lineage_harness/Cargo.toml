# Lineage harness (recipe overlay, protected). Built once at prepare (binary kept in /deps/bin); it loads
# the program's .so from the tree under test at run time, so patches cannot change it.
[package]
name = "lineage-harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "lineage-cu"
path = "src/main.rs"

[dependencies]
mollusk-svm = "=0.12.0"
solana-account = "3"
solana-instruction = "3"
solana-pubkey = "3"

[profile.release]
debug = 0

[workspace]
