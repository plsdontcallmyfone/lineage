# keis/base58, second recipe: the same repository and commit as recipes/base58-py (frozen), with a
# heavier workload and six targets (docs/plans/AGENT-EFFICIENCY.md section 6).
# MIT licence (COPYING). No contribution policy against AI-generated changes (repo has no
# CONTRIBUTING file; checked 2026-10-07).
#
# Why a second recipe: at the first unit's tip, starting the interpreter and the imports had become
# 35 to 51% of its three metrics, so the 1% minimum effect was up to 2% of what a change to the
# library can touch. Here every metric runs batches large enough that the library is nearly all of
# the count (the share that is not the library is measured by
# `python lineage_bench.py <mode> <seed> --inputs-only`, scripts/efficiency/fixed-share.ts), and the
# targets are one per code path: address-sized encode and decode in batches (bytes and str, both
# alphabets, whitespace, autofix), long blobs in both directions, Base58Check, and the integer codecs.
#
# Prepare, the byte-compiled stdlib and the determinism notes are those of recipes/base58-py:
# cachegrind counts guest instructions only; PYTHONHASHSEED=0 is set by the sandbox; the harness
# turns the cyclic GC off; inputs come only from $LINEAGE_SEED; residual drift (process environment,
# first run in a fresh container) is far below det_tolerance (0.1%).
name: base58-py-heavy
class: python
requires: { arch: arm64 }
repo: https://github.com/keis/base58
commit: "2fae7065e3446e69e5d748c767011f05eee8400e"
image: "lineage/python:m1@sha256:4214b1a6fb3757b7d706ce9547e728b18c53df40f0bdf8ebcdef5b81335186d0"
workdir: /work/src
prepare:
  - python -m venv /deps/venv
  - "/deps/venv/bin/pip install --no-cache-dir --only-binary=:all: pytest==8.3.5 PyHamcrest==2.1.0 pytest-benchmark==5.1.0"
  - PYTHONPYCACHEPREFIX=/deps/pycache python -m compileall -q -x "/(test|tests|idlelib|lib2to3|tkinter|turtledemo)/" /usr/local/lib/python3.12 /deps/venv/lib/python3.12/site-packages
prepare_outputs: []
build:
  # Pure Python: "build" is an import check, which fails on syntax errors and import-time crashes.
  commands:
    - python -c "import base58, sys; print(base58.__version__, sys.version.split()[0])"
  artifacts: []
  reproducible: false
test:
  # Upstream CI runs `pytest --benchmark-disable .`; same here, junit for stable ids.
  command: PYTHONPYCACHEPREFIX=/deps/pycache python -m pytest -p no:cacheprovider -q --benchmark-disable --junitxml=/out/junit.xml test_base58.py test_base45.py
  parser: junit
  exclude: []
  timeout_s: 300
equivalence:
  command: PYTHONPYCACHEPREFIX=/deps/pycache python lineage_equiv.py "$LINEAGE_SEED"
  output: stdout-digest
metrics:
  - name: encode_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py encode "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: decode_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py decode "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: encode_long_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py encode_long "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: decode_long_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py decode_long "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: check_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py check "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: int_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py int "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
patch:
  allowed_paths: ["base58/**"]
  protected_paths:
    - "test_*.py"
    - "setup.py"
    - "setup.cfg"
    - "MANIFEST.in"
    - "base58/py.typed"
    - ".github/**"
    - "**/*.yml"
    - "**/*.yaml"
    - "lineage_*"
  max_files: 5
  max_lines: 200
limits: { cpus: 2, memory_mb: 2048, pids: 256, wall_s: 1800, disk_mb: 4096 }
