# ethereum/pyrlp: the Python implementation of RLP (Recursive Length Prefix), Ethereum's
# serialization format for transactions, blocks and devp2p messages, published on PyPI as `rlp`
# and used by py-evm, eth-account and web3.py's stack (maintenance moved to the ApeWorX collective;
# the repository stays under ethereum/). MIT licence (LICENSE, pyproject.toml). No CONTRIBUTING,
# AI policy or AGENTS file in the repository, and no ethereum/.github organisation defaults
# (checked 2026-10-08).
#
# Why: the pure-Python codec (used when the optional rusty-rlp backend is absent, which the image
# does not install) decodes every list by concatenating the RLP of its items into a fresh bytes
# object item by item and inserting at the front of a list, and encodes through a recursive
# generator join with a per-item isinstance chain, so instruction counts have real headroom.
#
# Version metadata: rlp/__init__.py reads its version with importlib.metadata, which needs an
# installed distribution. prepare writes a minimal rlp-5.0.0.dist-info (the snapshot is the v5.0.0
# tag) into the venv instead of installing the package, and PYTHONPATH puts the tree under test
# first, so the code that runs is always the tree's.
#
# Tests: upstream's tests/core suite (pytest + hypothesis, versions inside pyrlp's own test group
# bounds), with a fixed hypothesis seed so every run draws the same examples. The optional
# pytest-benchmark tests skip when it is absent.
#
# Determinism: cachegrind guest instruction counts; PYTHONHASHSEED=0 set by the sandbox; GC
# disabled in the harness; inputs derived only from $LINEAGE_SEED; stdlib and site-packages
# pre-compiled into /deps/pycache. Calibrated on arm64.
name: pyrlp
class: python
requires: { arch: arm64 }
repo: https://github.com/ethereum/pyrlp
commit: "ff7edeb765a539d6384daf2b66cc3cd9405265e6"
image: "lineage/python:m1@sha256:4214b1a6fb3757b7d706ce9547e728b18c53df40f0bdf8ebcdef5b81335186d0"
workdir: /work/src
prepare:
  - python -m venv /deps/venv
  - "/deps/venv/bin/pip install --no-cache-dir --only-binary=:all: pytest==8.3.5 hypothesis==6.108.5 eth-utils==6.0.0"
  - mkdir -p /deps/venv/lib/python3.12/site-packages/rlp-5.0.0.dist-info
  - "printf 'Metadata-Version: 2.1\\nName: rlp\\nVersion: 5.0.0\\n' > /deps/venv/lib/python3.12/site-packages/rlp-5.0.0.dist-info/METADATA"
  - PYTHONPYCACHEPREFIX=/deps/pycache python -m compileall -q -x "/(test|tests|idlelib|lib2to3|tkinter|turtledemo)/" /usr/local/lib/python3.12 /deps/venv/lib/python3.12/site-packages
prepare_outputs: []
build:
  commands:
    - PYTHONPATH=/work/src /deps/venv/bin/python -c "import rlp, sys; print(rlp.__version__, sys.version.split()[0])"
  artifacts: []
  reproducible: false
test:
  command: PYTHONPATH=/work/src PYTHONPYCACHEPREFIX=/deps/pycache /deps/venv/bin/python -m pytest -p no:cacheprovider -q --hypothesis-seed=0 --junitxml=/out/junit.xml tests/core
  parser: junit
  exclude: []
  timeout_s: 600
equivalence:
  command: PYTHONPATH=/work/src PYTHONIOENCODING=utf-8 PYTHONPYCACHEPREFIX=/deps/pycache /deps/venv/bin/python lineage_equiv.py "$LINEAGE_SEED"
  output: stdout-digest
metrics:
  - name: encode_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPATH=/work/src PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null /deps/venv/bin/python lineage_bench.py encode "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: decode_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPATH=/work/src PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null /deps/venv/bin/python lineage_bench.py decode "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: sedes_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPATH=/work/src PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null /deps/venv/bin/python lineage_bench.py sedes "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
patch:
  allowed_paths: ["rlp/**"]
  protected_paths:
    - "tests/**"
    - "pyproject.toml"
    - "setup.py"
    - "docs/**"
    - ".github/**"
    - "**/*.yml"
    - "**/*.yaml"
    - "lineage_*"
  max_files: 5
  max_lines: 200
limits: { cpus: 2, memory_mb: 2048, pids: 256, wall_s: 1200, disk_mb: 4096 }
