# keis/base58: pure-Python Base58 / Base58Check (Bitcoin, Solana and XRP address encoding).
# MIT licence (COPYING). No contribution policy against AI-generated changes (repo has no
# CONTRIBUTING file; checked 2026-10-07).
#
# Why: the codec is pure Python and naive (one bigint divmod per output digit, bytes prepended
# in a loop, one multiply-add per input char on decode), so instruction counts have real headroom.
#
# Determinism notes (verified by scripts/calibrate-recipe.ts, cv recorded in calibration.json):
# - Instruction counts come from cachegrind, which counts guest instructions only.
# - PYTHONHASHSEED=0 is set by the sandbox, so str/bytes hashing and dict layout are fixed.
# - The harness disables the cyclic GC (gc.disable()) so collection points cannot move when a
#   patch changes allocation counts; refcounting still frees everything this workload makes.
# - Inputs are derived only from $LINEAGE_SEED (sha256 -> random.Random).
# - The official python image ships without __pycache__, so every import would compile the
#   stdlib from source (importing `typing` alone cost ~460M of the first harness's ~900M
#   instructions). prepare byte-compiles the stdlib and the venv into /deps/pycache and every
#   command sets PYTHONPYCACHEPREFIX to it (read-only at run time, so the patched library itself
#   is still compiled on import; that compile cost is part of the metric and is small).
# - Residual drift: instruction counts depend slightly on the process environment (adding or
#   removing one env var moved the count by ~230K of ~730M in a manual test; the sandbox env is
#   fixed apart from Docker's per-container HOSTNAME, which has a fixed length) and on the first
#   run in a fresh container (~1K instructions, consistent with directory listing order in the
#   import system's path cache). Both are far below det_tolerance (0.1%).
name: base58-py
class: python
requires: { arch: arm64 }
repo: https://github.com/keis/base58
commit: "2fae7065e3446e69e5d748c767011f05eee8400e"
image: "lineage/python:m1@sha256:4214b1a6fb3757b7d706ce9547e728b18c53df40f0bdf8ebcdef5b81335186d0"
workdir: /work/src
prepare:
  - python -m venv /deps/venv
  - "/deps/venv/bin/pip install --no-cache-dir --only-binary=:all: pytest==8.3.5 PyHamcrest==2.1.0 pytest-benchmark==5.1.0"
  - PYTHONPYCACHEPREFIX=/deps/pycache python -m compileall -q -x "/(test|tests|idlelib|lib2to3|tkinter|turtledemo)/" /usr/local/lib/python3.12 /deps/venv/lib/python3.12/site-packages
prepare_outputs: []
build:
  # Pure Python: "build" is an import check, which fails on syntax errors and import-time crashes.
  commands:
    - python -c "import base58, sys; print(base58.__version__, sys.version.split()[0])"
  artifacts: []
  reproducible: false
test:
  # Upstream CI runs `pytest --benchmark-disable .`; same here, junit for stable ids.
  command: PYTHONPYCACHEPREFIX=/deps/pycache python -m pytest -p no:cacheprovider -q --benchmark-disable --junitxml=/out/junit.xml test_base58.py test_base45.py
  parser: junit
  exclude: []
  timeout_s: 300
equivalence:
  command: PYTHONPYCACHEPREFIX=/deps/pycache python lineage_equiv.py "$LINEAGE_SEED"
  output: stdout-digest
metrics:
  - name: encode_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py encode "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: decode_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py decode "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
  - name: check_ir
    kind: perf
    direction: lower
    deterministic: true
    command: PYTHONPYCACHEPREFIX=/deps/pycache valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null python lineage_bench.py check "$LINEAGE_SEED"
    parser: cachegrind-ir
    holdout: true
    min_effect: 0.01
patch:
  allowed_paths: ["base58/**"]
  protected_paths:
    - "test_*.py"
    - "setup.py"
    - "setup.cfg"
    - "MANIFEST.in"
    - "base58/py.typed"
    - ".github/**"
    - "**/*.yml"
    - "**/*.yaml"
    - "lineage_*"
  max_files: 5
  max_lines: 200
limits: { cpus: 2, memory_mb: 2048, pids: 256, wall_s: 900, disk_mb: 4096 }
