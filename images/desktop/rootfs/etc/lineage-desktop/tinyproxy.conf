# Allowlist proxy for lineage desktops: only the hosts in the filter (desk-proxy writes it), only
# HTTPS CONNECT on 443 and plain HTTP to the same hosts.
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 64
LogLevel Notice
PidFile "/tmp/proxy/tinyproxy.pid"
Filter "@FILTER@"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
ConnectPort 443
DisableViaHeader Yes
