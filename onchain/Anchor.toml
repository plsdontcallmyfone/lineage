lineage_msg = "E6vHskQjJAMLqDKXyfnn2ZDjeJ57RZXR4H9RjPDzapAB"

[programs.devnet]
lineage_registry = "2vhj9aBZkuoCpmJxm5BcA3CYkvBJgY6VHTax8FpFmxuY"
lineage_launch = "8eHzm1XtNtbxJujrMAci4VdhCJvQttFUBukmkFaUwsAT"
