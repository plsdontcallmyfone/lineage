[package]
name = "units-onchain-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anchor-lang = { version = "=0.31.1" }
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }
units-registry = { path = "../programs/units-registry", features = ["no-entrypoint"] }
units-launch = { path = "../programs/units-launch", features = ["no-entrypoint"] }
units-msg = { path = "../programs/units-msg", features = ["no-entrypoint"] }
litesvm = "=0.6.1"
solana-keypair = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
solana-account = "2.2"
solana-compute-budget-interface = "2.2"
bincode = "1.3"
spl-token-2022 = { version = "6.0.0", features = ["no-entrypoint"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "allow" }
