name: UI tests

# The Playwright UI suite (docs/UI-TESTS.md) against the deployed devnet site. The site is public, so
# no secrets: the mock wallet uses a throwaway key and the checks that need a funded launcher are skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-tests
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UI_BASE_URL: https://157-245-71-188.sslip.io
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:ui
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-report
          path: tests/ui/.report
          retention-days: 14
